[project]
name = "taskflow-backend"
version = "0.1.0"
description = "TaskFlow REST API (FastAPI + Azure Cosmos DB)"
requires-python = ">=3.12"
dependencies = [
    "azure-cosmos>=4.7.0",
    "azure-identity>=1.19.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.14.1",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
